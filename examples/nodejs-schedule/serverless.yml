service: node-event-example
configValidationMode: off
provider:
  name: scaleway
  runtime: node26

plugins:
  - serverless-scaleway-functions

package:
  patterns:
    - "!.gitignore"
    - "!.git/**"

functions:
  first:
    handler: handler.handle
    events:
      - schedule:
          rate: "1 * * * *"
          input:
            foo: "some-string"
            bar: 1234
