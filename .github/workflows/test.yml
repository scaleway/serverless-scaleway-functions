---
name: npmtest

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: npx prettier@3.9.6 --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Build
        run: bun run build

  test:
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        tests:
          [
            "containers",
            "containers-private",
            "deploy",
            "domains",
            "functions",
            "multi-region",
            "provider",
            "runtimes",
            "shared",
            "triggers",
          ]
        node-version: ["22.x", "24.x"]

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up node ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Serverless Framework
        run: bun install -g osls@3.77.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:${{ matrix.tests }}
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}

  clean-up:
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up node 24.x
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Serverless Framework
        run: bun install -g osls@3.77.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run cleanup
        run: bun run clean-up
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
